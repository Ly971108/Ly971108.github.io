    <h1>开篇：为什么要做这个网站</h1>
    <p class="meta"><time datetime="2026-10-20">2026-10-20</time></p>
    <p>受 Felix Rieseberg 个人站的启发，我决定把自己的个人网站做成一间农村夏夜的老屋：CRT 电视、摇头风扇、蚊香、奖状墙、窗外的星空和萤火虫。</p>
<h2>为什么是 3D</h2>
<p>个人网站是互联网上最后还能随意发挥创造力的地方之一。与其做一个标准模板的首页，不如做一个可以待着的空间。文章是这个空间里的物件：作业本、挂历、电视屏幕。</p>
<h2>内容计划</h2>
<ul>
<li>技术笔记与教程</li>
<li>阅读与思考</li>
<li>偶尔的生活记录</li>
</ul>
