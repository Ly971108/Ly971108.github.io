<script>
(function(){
  var d=document, root=d.documentElement, q=new URLSearchParams(location.search).get("view");
  var RM=window.__RM={page:"home", assetBase:d.getElementById("rm-root").dataset.assets||null};

  // 文章数据：两个消费方（3D 场景 / 静态版分组）
  RM.posts=[].map.call(d.querySelectorAll("#rm-posts a"),function(a){return {t:(a.querySelector(".t")||a).textContent,u:a.getAttribute("href"),d:a.dataset.date};});
  RM.postsA=RM.posts.map(function(p){return [p.t,p.u,p.d];});

  // about 长文 → 结构化块（段落 + 链接区间）
  RM.about=(function(){
    var t=d.getElementById("rm-about"), out=[], sp=function(x){ return x.replace(/\s+/g," ").trim(); };
    if(!t) return out;
    var para=function(el){
      var text="", links=[];
      (function walk(n){ [].forEach.call(n.childNodes,function(c){
        if(c.nodeType===3){ text+=c.nodeValue.replace(/\s+/g," "); return; }
        if(c.nodeType!==1) return;

        var a=c.tagName==="A"&&c.getAttribute("href"), at=text.length; walk(c);
        if(a&&text.length>at) links.push([at,text.length,c.getAttribute("href")]);
      }); })(el);
      var lead=text.length-text.replace(/^\s+/,"").length; text=text.trim();
      links=links.map(function(l){ return [Math.max(0,l[0]-lead),Math.min(text.length,l[1]-lead),l[2]]; }).filter(function(l){ return l[1]>l[0]; });
      return links.length?["p",text,links]:["p",text];
    };
    (function blocks(root){ [].forEach.call(root.children,function(el){
      var tag=el.tagName;
      if(/^H[1-6]$/.test(tag)) out.push(["h",sp(el.textContent)]);
      else if(tag==="P"){ var b=para(el); if(b[1]) out.push(b); }
      else if(tag==="UL"||tag==="OL") [].forEach.call(el.children,function(li,i){ out.push(["l",sp(li.textContent),tag==="OL"?(i+1)+".":"*"]); });
      else if(tag==="BLOCKQUOTE") out.push(["q",sp(el.textContent)]);
      else if(tag==="HR") out.push(["r"]);
      else if(tag==="PRE") out.push(["c",el.textContent.replace(/\n$/,"")]);
      else if(tag==="IMG") out.push(["i",el.getAttribute("alt")||""]);
      else if(tag==="FIGURE"||tag==="DIV"||tag==="SECTION"){ var img=el.querySelector("img"); if(img&&!el.querySelector("p,h1,h2,h3,ul,ol,pre")) out.push(["i",img.getAttribute("alt")||""]); else blocks(el); }
    }); })(t.content);
    return out;
  })();

  // 场景只在 WebGL2 下运行
  var gl=false, glx=null; try{ glx=window.WebGL2RenderingContext&&d.createElement("canvas").getContext("webgl2"); gl=!!glx; }catch(e){}
  var kind="desktop";

  // 路由：hash ↔ 路径翻译 + title 同步（复刻 Felix）
  var base=new URL("./",location.href).pathname.replace(/\/+$/,"/");
  var R={home:base,about:base+"about/",posts:base+"posts/",online:base+"online/"}, P={};
  var ALIAS={};
  for(var k in R) P[R[k]]=k;
  var own=function(pg){ return pg==="home"||pg==="about"; };
  var site=d.getElementById("rm-root").dataset.site||d.title, T={home:site,about:"关于 · "+site,posts:"写作 · "+site,online:"联系 · "+site};
  for(var t in T) if(t!=="home") T[t]=T[t]; T[RM.page]=d.title;
  var syncTitle=function(){ var h=location.hash.slice(1); h=ALIAS[h]||h; var pg=R[h]&&!own(h)?h:P[location.pathname]; if(pg&&(pg===h||own(pg))&&T[pg]) d.title=T[pg]; };
  addEventListener("popstate",function(){ syncTitle(); setTimeout(syncTitle,0); });
  addEventListener("hashchange",syncTitle); syncTitle();

  RM.pageAt=function(path){ var pg=P[path]; return pg&&own(pg)?pg:""; };
  { var raw={replaceState:history.replaceState.bind(history),pushState:history.pushState.bind(history)};
    ["replaceState","pushState"].forEach(function(fn){
      history[fn]=function(s,t,u){
        if(typeof u==="string"){
          var m=u.match(/#(\w+)$/), path=u.split(/[?#]/)[0];

          if(m&&R[m[1]]&&own(m[1])) u=R[m[1]]+location.search;
          else if(m&&R[m[1]]) u=R.home+location.search+m[0];
          else if(m) u=location.pathname+location.search;
          else if(u.indexOf("#")<0&&P[path]&&P[path]!=="home") u=R.home+location.search;
          var pg=m&&R[m[1]]&&!own(m[1])?m[1]:P[u.split(/[?#]/)[0]]; if(pg&&T[pg]) d.title=T[pg];
        }
        return raw[fn](s,t,u);
      };
    }); }

  // 静态版装配
  var css=null;
  RM.plain=function(soft){
    root.classList.remove("rm-scene","rm-"+kind); if(css) css.disabled=true;
    var r=d.getElementById("rm-root"); if(r) r.textContent="";
    var bg=d.getElementById("rm-bg"); if(bg) bg.disabled=true;
    var home=!!d.querySelector(".rm-plain");

    if(soft){ var t2=d.getElementById("rm-try"); if(t2) t2.hidden=false; var hero=d.getElementById("rm-hero"); if(hero) hero.href="?room=1"; }
    var warn=d.getElementById("rm-warn"), wx=d.getElementById("rm-warn-x");
    if(read){ if(warn) warn.hidden=true;
      [].forEach.call(d.querySelectorAll(".rm-fallback a.ph-room[data-room]"),function(a){ a.href=R.home+"?room=1"; a.hidden=false; });
      var hero2=d.getElementById("rm-hero"); if(hero2){ hero2.href=R.home+"?room=1"; hero2.onclick=unread; } }
    else if(warn&&wx){ try{ if(localStorage.getItem("rm.plainWarn")==="off") warn.hidden=true; }catch(e){}
      wx.hidden=false; wx.onclick=function(){ warn.hidden=true; try{ localStorage.setItem("rm.plainWarn","off"); }catch(e){} }; }
    // 文章按年份分组，旧年份收进「更早文章」
    var idx=home&&d.getElementById("rm-posts-static");
    if(idx&&!idx.dataset.grouped){ idx.dataset.grouped=1; var yr=null, ol=null, from=new Date().getFullYear()-3, old=[], n=0;
      [].slice.call(idx.children).forEach(function(li){ var y=li.getAttribute("data-y");
        if(y!==yr){ yr=y; var g=d.createElement("li"); g.className="pb-yr"; g.innerHTML='<span class="y"></span><ol></ol>'; g.firstChild.textContent=y; idx.insertBefore(g,li); ol=g.lastChild;
          if(+y<from&&g!==idx.firstElementChild){ g.hidden=true; old.push(g); } }
        ol.appendChild(li); if(ol.parentNode.hidden) n++; }); idx.classList.add("pb-grouped");
      if(old.length){ var more=d.createElement("li"), mb=d.createElement("button"), y0=old[old.length-1].firstChild.textContent, y1=old[0].firstChild.textContent;
        more.className="pb-older"; mb.type="button"; mb.textContent=(n===1?"1 篇更早文章":n+" 篇更早文章")+"（"+(y0===y1?y0:y0+"–"+y1)+"）";
        mb.onclick=function(){ old.forEach(function(g){ g.hidden=false; }); more.remove(); var a=old[0].querySelector("a"); if(a) a.focus({preventScroll:true}); };
        more.appendChild(mb); idx.appendChild(more); } }
    var show=function(){ [].forEach.call(d.querySelectorAll(".rm-fallback"),function(e){ e.style.display="block"; }); }, left=0;
    ["assets/theme/flat.css","assets/theme/home.css"].forEach(function(h,i){
      var l=d.createElement("link"); l.rel="stylesheet"; l.href=h; if(i){ left++; l.onload=l.onerror=function(){ if(!--left) show(); }; } d.head.appendChild(l); });
    setTimeout(show,3000); return true;
  };

  // 软渲染黑名单（CPU 渲染会把机器拖死：Hacker News 事件教训）
  var soft=false; try{ if(gl&&!navigator.webdriver&&!/[?&]room=1\b/.test(location.search)){
    var ri=glx.getExtension("WEBGL_debug_renderer_info"), rn=String(glx.getParameter(ri?ri.UNMASKED_RENDERER_WEBGL:glx.RENDERER)||"");
    soft=/swiftshader|llvmpipe|softpipe|lavapipe|software|basic render/i.test(rn)||!d.createElement("canvas").getContext("webgl2",{failIfMajorPerformanceCaveat:true}); } }catch(e){}

  var force=/[?&]plain=1\b/.test(location.search)&&!/[?&]room=1\b/.test(location.search);
  var unread=function(){ try{ localStorage.removeItem("rm.view"); }catch(e){} }, read=false;
  try{ if(/[?&]room=1\b/.test(location.search)) unread();

  if(read) force=true;

  // 触屏 + 小屏：v1 默认静态版
  var coarse=false; try{ coarse=matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<760; }catch(e){}

  // 场景资产未就绪（M0 阶段）→ 也进静态版
