<main class="pb-grid"><article class="post about"><h1>关于我</h1>
<p>你好，我是站长。我在这个网站存放我的写作。</p>
<p>我在城市工作，写代码，也写文字。小时候在农村长大，夏夜的老屋、风扇、蚊香和星空是记忆里最舒服的部分，所以这个网站被做成了那间屋子。</p>

<p>本站是一个 3D 交互场景： CRT 电视旋钮切换频道，拉线灯切换黄昏/夜晚/深夜，风扇有四档，蚊香是声音开关，作业本和挂历里藏着文章。低配置设备会自动进入静态版，内容一致。</p>
